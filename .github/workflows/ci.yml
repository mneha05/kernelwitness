name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - run: pip install -e . pytest
      - run: pytest
      - run: kernelwitness doctor --json
      - run: kernelwitness demo --out docs/demo
      - run: kernelwitness run --attempts 2 --out /tmp/kw -- python examples/simulated_crash.py --seq 257 || test $? -eq 1
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install build
      - run: python -m build
