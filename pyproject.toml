[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelwitness"
version = "0.1.0"
description = "Turn GPU failures into structured, minimal, shareable repro bundles."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Neha Mahesh"}]
dependencies = []
keywords = ["cuda", "gpu", "debugging", "nvidia", "compute-sanitizer", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/mneha05/kernelwitness"
Documentation = "https://mneha05.github.io/kernelwitness/"
Issues = "https://github.com/mneha05/kernelwitness/issues"

[project.scripts]
kernelwitness = "kernelwitness.cli:main"

[tool.setuptools.packages.find]
include = ["kernelwitness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
